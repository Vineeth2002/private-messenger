name: android-identity-validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Rebuild native libraries and test Android identity storage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Emulator host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpulse0

      - name: Install pinned Android SDK, NDK and emulator image
        run: |
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up pinned Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@1.81.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/crypto-core -> target

      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build native libraries from committed Rust source
        working-directory: native/crypto-core
        run: |
          cargo ndk -t arm64-v8a -t x86_64 \
            -o ../../apps/android/app/src/main/jniLibs \
            build --release --locked
          test -s ../../apps/android/app/src/main/jniLibs/arm64-v8a/libpm_crypto_core.so
          test -s ../../apps/android/app/src/main/jniLibs/x86_64/libpm_crypto_core.so

      - name: Create ephemeral CI-only debug gateway CA resource
        shell: bash
        run: |
          set -euo pipefail
          CA_DIR="apps/android/app/src/debug/res/raw"
          mkdir -p "$CA_DIR"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout "$RUNNER_TEMP/dev_gateway_ca.key" \
            -out "$CA_DIR/dev_gateway_ca.pem" \
            -subj "/CN=PM CI Debug Gateway CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          rm -f "$RUNNER_TEMP/dev_gateway_ca.key"
          test -s "$CA_DIR/dev_gateway_ca.pem"
          openssl x509 -in "$CA_DIR/dev_gateway_ca.pem" -noout -subject
      - name: Run Android unit tests and assemble debug APK
        working-directory: apps/android
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Enable KVM for the emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              echo "PASS: /dev/kvm is readable and writable."
            else
              echo "::warning::/dev/kvm exists, but is not readable and writable by this runner."
            fi
          else
            echo "::warning::/dev/kvm is not available; emulator startup may use slower software acceleration."
          fi

      - name: Run real Android Keystore + UniFFI integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd apps/android && bash gradlew --no-daemon :app:connectedDebugAndroidTest
