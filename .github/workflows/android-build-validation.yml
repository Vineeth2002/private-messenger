name: android-build-validation

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'native/crypto-core/**'
      - '.github/workflows/android-build-validation.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'native/crypto-core/**'
      - '.github/workflows/android-build-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, lint, unit tests, and emulator startup smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install the pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Pre-install Android Emulator with retries
        shell: bash
        run: |
          set -uo pipefail

          SDK_ROOT_INPUT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "$SDK_ROOT_INPUT" || ! -d "$SDK_ROOT_INPUT" ]]; then
            echo "::error::Android SDK root is empty or does not exist."
            exit 1
          fi

          if ! SDK_ROOT="$(realpath -e -- "$SDK_ROOT_INPUT")"; then
            echo "::error::Could not resolve Android SDK root."
            exit 1
          fi

          # Guard every later cleanup operation against an invalid SDK path.
          if [[ "$SDK_ROOT" == "/" ||
              ! -d "$SDK_ROOT/cmdline-tools" ]]; then
            echo "::error::Android SDK root is invalid: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [[ -z "$SDKMANAGER" ]]; then
            for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Executable sdkmanager was not found."
            exit 1
          fi

          echo "Android SDK root: $SDK_ROOT"
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version || true

          for attempt in 1 2 3; do
            echo "Android Emulator installation attempt $attempt of 3"

            # Capture sdkmanager's status explicitly so a broken pipe from
            # the 'yes' process does not hide the package installation result.
            set +e
            set +o pipefail

            yes | "$SDKMANAGER" --verbose --install emulator --channel=0
            pipeline_status=( "${PIPESTATUS[@]}" )

            set -e
            set -o pipefail

            yes_status="${pipeline_status[0]:-1}"
            install_status="${pipeline_status[1]:-1}"

            echo "yes exit code: $yes_status"
            echo "sdkmanager exit code: $install_status"

            if [[ "$install_status" -eq 0 &&
                  -x "$SDK_ROOT/emulator/emulator" ]]; then
              echo "PASS: Android Emulator package is installed."
              "$SDK_ROOT/emulator/emulator" -version
              exit 0
            fi

            if [[ "$install_status" -eq 0 ]]; then
              echo "::warning::sdkmanager returned success, but the emulator executable is missing."
              install_status=1
            fi

            echo "::warning::Android Emulator installation attempt $attempt failed with exit code $install_status."

            # Clear only known SDK download/install paths. SDK_ROOT was
            # resolved and validated above before these removals are allowed.
            rm -rf -- \
              "$SDK_ROOT/.temp" \
              "$SDK_ROOT/.downloadIntermediates" \
              "$SDK_ROOT/emulator"

            if [[ -n "${HOME:-}" &&
                  "$HOME" != "/" &&
                  -d "$HOME/.android/cache" ]]; then
              rm -rf -- "$HOME/.android/cache"
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep 10
            fi
          done

          echo "::error::Android Emulator installation failed after 3 attempts."
          exit 1

      - name: Verify checked-in native library ABI files
        shell: bash
        run: |
          set -euo pipefail

          ARM_LIB="apps/android/app/src/main/jniLibs/arm64-v8a/libpm_crypto_core.so"
          X64_LIB="apps/android/app/src/main/jniLibs/x86_64/libpm_crypto_core.so"

          test -s "$ARM_LIB"
          test -s "$X64_LIB"

          readelf -h "$ARM_LIB" | grep -Eq 'Machine:.*AArch64'
          readelf -h "$X64_LIB" | grep -Eq 'Machine:.*X86-64'

          echo "PASS: both native libraries exist and match their declared ABI directories."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, lint, and run Android unit tests
        id: build
        working-directory: apps/android
        run: |
          bash ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify both native libraries are packaged in the APK
        shell: bash
        run: |
          set -euo pipefail

          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          unzip -l "$APK" > /tmp/pm-apk-list.txt

          grep -Fq 'lib/arm64-v8a/libpm_crypto_core.so' /tmp/pm-apk-list.txt
          grep -Fq 'lib/x86_64/libpm_crypto_core.so' /tmp/pm-apk-list.txt

          echo "PASS: debug APK includes arm64-v8a and x86_64 native libraries."

      - name: Enable KVM for the emulator
        shell: bash
        run: |
          set -euo pipefail

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm

            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              echo "PASS: /dev/kvm is readable and writable."
            else
              echo "::warning::/dev/kvm exists, but is not readable and writable by this runner."
            fi
          else
            echo "::warning::/dev/kvm is not available; emulator startup may use slower software acceleration."
          fi

      - name: Boot app and exercise native UniFFI initialization on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: apps/android
          script: |
            set -Eeuo pipefail

            echo "Checking Android Debug Bridge..."
            adb version
            adb devices -l
            adb wait-for-device

            echo "Waiting for the Android package service..."
            PACKAGE_SERVICE_READY=false

            for attempt in {1..60}; do
              if adb shell service check package 2>/dev/null | grep -q 'found'; then
                PACKAGE_SERVICE_READY=true
                break
              fi

              sleep 2
            done

            if [[ "$PACKAGE_SERVICE_READY" != true ]]; then
              echo "::error::Android package service did not become ready."
              adb devices -l || true
              adb logcat -d -t 500 || true
              exit 1
            fi

            echo "Installing debug APK..."

            if ! adb install -r app/build/outputs/apk/debug/app-debug.apk; then
              echo "::error::APK installation failed."
              adb devices -l || true
              adb logcat -d -t 500 || true
              exit 1
            fi

            adb shell am force-stop org.sovereign.pm || true
            adb logcat -c

            echo "Starting the application..."
            adb shell am start -W -n org.sovereign.pm/.MainActivity

            sleep 5

            if ! adb shell pidof org.sovereign.pm; then
              echo "::error::Application process was not found after startup."
              adb logcat -d -t 500 || true
              exit 1
            fi

            sleep 3

            if ! adb shell pidof org.sovereign.pm; then
              echo "::error::Application process did not remain running."
              adb logcat -d -t 500 || true
              exit 1
            fi

            adb shell uiautomator dump /sdcard/pm-window.xml
            adb pull /sdcard/pm-window.xml pm-window.xml

            grep -Fq 'UniFFI CBOR: PASS' pm-window.xml
            grep -Fq 'Identity storage: CREATED_AND_PERSISTED' pm-window.xml
            grep -Fq 'At-rest encryption: PASS' pm-window.xml

            echo "PASS: app launched, UniFFI CBOR passed, identity storage persisted, and at-rest encryption passed."

      - name: Upload debug APK and emulator UI evidence
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: private-messenger-android-debug-validation
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/pm-window.xml
          if-no-files-found: warn
          retention-days: 7
