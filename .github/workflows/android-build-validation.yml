name: android-build-validation

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'native/crypto-core/**'
      - '.github/workflows/android-build-validation.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'native/crypto-core/**'
      - '.github/workflows/android-build-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, lint, unit tests, and emulator startup smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install the pinned Android SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Verify checked-in native library ABI files
        shell: bash
        run: |
          set -euo pipefail
          ARM_LIB="apps/android/app/src/main/jniLibs/arm64-v8a/libpm_crypto_core.so"
          X64_LIB="apps/android/app/src/main/jniLibs/x86_64/libpm_crypto_core.so"
          test -s "$ARM_LIB"
          test -s "$X64_LIB"
          readelf -h "$ARM_LIB" | grep -Eq 'Machine:.*AArch64'
          readelf -h "$X64_LIB" | grep -Eq 'Machine:.*X86-64'
          echo "Both native libraries exist and match their declared ABI directories."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, lint, and run Android unit tests
        id: build
        working-directory: apps/android
        run: bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify both native libraries are packaged in the APK
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" > /tmp/pm-apk-list.txt
          grep -Fq 'lib/arm64-v8a/libpm_crypto_core.so' /tmp/pm-apk-list.txt
          grep -Fq 'lib/x86_64/libpm_crypto_core.so' /tmp/pm-apk-list.txt
          echo "PASS: debug APK includes arm64-v8a and x86_64 native libraries."

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot app and exercise native UniFFI initialization on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          working-directory: apps/android
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop org.sovereign.pm || true
            adb logcat -c
            adb shell am start -W -n org.sovereign.pm/.MainActivity
            sleep 5
            adb shell pidof org.sovereign.pm || (adb logcat -d; exit 1)
            sleep 3
            adb shell pidof org.sovereign.pm || (adb logcat -d; exit 1)
            adb shell uiautomator dump /sdcard/pm-window.xml >/dev/null
            adb pull /sdcard/pm-window.xml pm-window.xml
            grep -Fq 'UniFFI CBOR: PASS' pm-window.xml
            grep -Fq 'Account context: PASS' pm-window.xml
            echo "PASS: app launched and its native UniFFI CBOR/account initialization path completed."

      - name: Upload debug APK and emulator UI evidence
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: private-messenger-android-debug-validation
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/pm-window.xml
          if-no-files-found: warn
          retention-days: 7
